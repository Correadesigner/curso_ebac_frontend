<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário M12</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./main.css"/>
</head>
<body>
<div class="container">
    <div class="row form">
        <div class="col">
            <h2>Entre em Contato</h2>
            <form class="row" action="">
                <label class="form-label" for="nome">Seu nome:</label>
                <input class="form-control" type="text" name="nome" id="nome">

                <label class="form-label" for="email">Seu e-mail:</label>
                <input class="form-control" type="email" name="email" id="email">

                <label class="form-label" for="tel">Seu melhor Telefone:</label>
                <input class="form-control" type="tel" name="telefone" id="telefone">
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="aceito-termos">
                    <label class="form-check-label" for="aceito-termos"> Li e concordo com os termos do site.</label>
                </div>
                <button class="btn btn-success">Enviar</button>
            </form>
        </div>
    </div>
</div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
